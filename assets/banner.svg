<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="60%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradient for Text & Borders -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shimmerBadge {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.7)); }
      }

      .floating-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-2 { animation: floatSlow2 8s ease-in-out infinite; }
      .floating-3 { animation: floatSlow3 6s ease-in-out infinite; }
      .glow-pulse { animation: pulseGlow 5s ease-in-out infinite alternate; transform-origin: center; }
      .flow-line { stroke-dasharray: 12 8; animation: flowDash 15s linear infinite; }
      .badge-glow { animation: shimmerBadge 4s ease-in-out infinite; }

      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .code-font {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Glow Circles -->
  <g class="glow-pulse">
    <circle cx="220" cy="120" r="180" fill="url(#glowIndigo)" />
    <circle cx="980" cy="240" r="200" fill="url(#glowCyan)" />
    <circle cx="650" cy="80" r="160" fill="url(#glowPurple)" />
  </g>

  <!-- Dynamic Flowing Data Lines in Background -->
  <g opacity="0.45">
    <path class="flow-line" d="M -50,190 C 250,90 450,290 800,160 C 1000,90 1150,220 1250,180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50,230 C 200,320 500,100 850,240 C 1020,310 1120,150 1250,220" fill="none" stroke="#a855f7" stroke-width="1.8" />
    <path class="flow-line" d="M -50,100 C 350,200 650,50 950,180 C 1100,240 1180,120 1250,150" fill="none" stroke="#6366f1" stroke-width="1.5" />
  </g>

  <!-- Animated Floating Context Cards (Positioned in Corners to Keep Center Text Crisp & Unobscured) -->
  <g class="floating-1" opacity="0.85">
    <g transform="translate(60, 45)">
      <rect width="165" height="42" rx="8" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="21" r="5" fill="#38bdf8" />
      <text x="32" y="26" fill="#e2e8f0" font-size="12" class="code-font" font-weight="600">docsify :: runtime</text>
    </g>
  </g>

  <g class="floating-2" opacity="0.85">
    <g transform="translate(50, 275)">
      <rect width="180" height="42" rx="8" fill="url(#cardGrad1)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="21" r="5" fill="#818cf8" />
      <text x="32" y="26" fill="#e2e8f0" font-size="12" class="code-font" font-weight="600">docusaurus :: v3.x</text>
    </g>
  </g>

  <g class="floating-3" opacity="0.85">
    <g transform="translate(980, 50)">
      <rect width="160" height="42" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="21" r="5" fill="#10b981" />
      <text x="32" y="26" fill="#e2e8f0" font-size="12" class="code-font" font-weight="600">OpenAPI 3.1 &amp; MCP</text>
    </g>
  </g>

  <g class="floating-1" opacity="0.85">
    <g transform="translate(970, 280)">
      <rect width="170" height="42" rx="8" fill="url(#cardGrad1)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="21" r="5" fill="#ec4899" />
      <text x="32" y="26" fill="#e2e8f0" font-size="12" class="code-font" font-weight="600">llms.txt :: AI Agent</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: High contrast, centered, fully unobstructed -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g class="badge-glow">
      <rect x="-170" y="-18" width="340" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#textGradient)" stroke-width="1.5" />
      <text x="0" y="4" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5" class="code-font">⚡ AWESOME DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="78" fill="#ffffff" font-size="44" class="title" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Documentation Site Generators
    </text>

    <!-- Subtitle -->
    <text y="122" fill="#94a3b8" font-size="18" class="subtitle">
      Curated Index of SaaS Platforms &amp; Open-Source Engines for Markdown, API Specs &amp; Agent Docs
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#38bdf8" font-size="11" class="code-font" font-weight="600">⚡ Blazing SSG</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#818cf8" font-size="11" class="code-font" font-weight="600">📖 OpenAPI 3.1</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(10, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#a855f7" font-size="11" class="code-font" font-weight="600">🤖 llms.txt &amp; MCP</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(180, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#34d399" font-size="11" class="code-font" font-weight="600">🌟 Star Ranked</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(330, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#f43f5e" font-size="11" class="code-font" font-weight="600">📊 SaaS Pricing</text>
      </g>
    </g>
  </g>

  <!-- Bottom Border Highlight -->
  <rect x="0" y="377" width="1200" height="3" fill="url(#textGradient)" />
</svg>
